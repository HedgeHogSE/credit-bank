server:
  port: 8084

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddRequestHeader=X-Gateway-Processed, true
          routes:
            - id: deal-route
              uri: ${GATEWAY_DEAL_URL:http://localhost:8081}
              predicates:
                - Path=/deal/**
              filters:
                - AddRequestHeader=X-Service-Name, Deal-Service

            - id: statement-route
              uri: ${GATEWAY_STATEMENT_URL:http://localhost:8082}
              predicates:
                - Path=/statement/**
              filters:
                - AddRequestHeader=X-Service-Name, Statement-Service
          globalcors:
            cors-configurations:
              '[/**]':
                          allowedOrigins: "*"
                          allowedMethods: "*"
                          allowedHeaders: "*"

springdoc:
  swagger-ui:
    urls:
      - name: "0. API Gateway"
        url: /v3/api-docs
      - name: "1. Deal Service"
        url: /deal/v3/api-docs
      - name: "2. Statement Service"
        url: /statement/v3/api-docs
logbook:
  filter:
    enabled: true

logging:
  level:
    org.zalando.logbook: TRACE